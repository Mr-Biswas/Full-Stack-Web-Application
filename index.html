<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LifeLedger Lite</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<div id="app">

    <!-- Header -->

    <header class="top-bar">

        <h1 class="logo">
            লাইফলেজার 📝
        </h1>

    </header>

    <!-- Main Content -->

    <main id="main-content">

        <!-- Dashboard -->

        <section
            id="dashboard-page"
            class="page active">

            <h2>Dashboard</h2>

        </section>

        <!-- Expense -->

        <section
            id="expense-page"
            class="page">

            <h2>Expense</h2>

        </section>

        <!-- Travel -->

        <section
            id="travel-page"
            class="page">

            <h2>Travel</h2>

        </section>

        <!-- Health -->

        <section
            id="health-page"
            class="page">

            <h2>Health & Wellness</h2>

        </section>

        <!-- Notes -->

        <section
            id="notes-page"
            class="page">

            <h2>Important Notes</h2>

        </section>

        <!-- Settings -->

        <section
            id="settings-page"
            class="page">

            <h2>Settings</h2>

        </section>

    </main>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <button
            class="nav-btn active"
            data-page="dashboard">

            🏠
            <span>Home</span>

        </button>

        <button
            class="nav-btn"
            data-page="expense">

            💰
            <span>Expense</span>

        </button>

        <button
            class="nav-btn"
            data-page="travel">

            🚁
            <span>Travel</span>

        </button>

        <button
            class="nav-btn"
            data-page="health">

            ❤️
            <span>Health</span>

        </button>

        <button
            class="nav-btn"
            data-page="notes">

            📝
            <span>Notes</span>

        </button>

        <button
            class="nav-btn"
            data-page="settings">

            ⚙️
            <span>Settings</span>

        </button>

    </nav>

</div>

<script src="js/googleSheets.js"></script>

<script src="js/dashboard.js"></script>
<script src="js/expense.js"></script>
<script src="js/travel.js"></script>
<script src="js/health.js"></script>
<script src="js/notes.js"></script>
<script src="js/settings.js"></script>

<script src="js/navigation.js"></script>
<script src="js/app.js"></script>

</body>
</html>
